# One robot move. Element of TransferRequest.moves.
# A pick followed by a place.
# Every field is fixed-length, so sending it alone costs nothing to serialize.
message: MoveInfo
version: 1
namespace: demo
owner: robot
desc: one robot move

fields:
  # Source location name. Examples: SHELF1, TABLE3
  - {key: from, type: string(32), desc: source location}
  - {key: to, type: string(32), desc: target location}
  - {key: slot, type: int, default: 1, desc: source slot number (1-based)}
