<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="898" height="458" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>

  <text x="24" y="38" font-size="15" font-weight="600" fill="#57606a">BUILD TIME</text>
  <rect x="150" y="50" width="250" height="66" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="275" y="90" text-anchor="middle" font-size="19" font-family="Consolas, Menlo, monospace" fill="#0550ae">schemas/*.yaml</text>
  <line x1="402" y1="83" x2="473" y2="83" stroke="#57606a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="477" y="50" width="160" height="66" rx="12" fill="#1f2328"/>
  <text x="557" y="90" text-anchor="middle" font-size="21" font-weight="600" fill="#ffffff">protacoc</text>

  <path d="M530,118 C480,165 200,160 155,205" fill="none" stroke="#57606a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="225" y="152" font-size="15" font-family="Consolas, Menlo, monospace" fill="#57606a">--cpp_out</text>
  <path d="M557,118 C545,160 470,165 450,205" fill="none" stroke="#57606a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="514" y="170" font-size="15" font-family="Consolas, Menlo, monospace" fill="#57606a">--cs_out</text>
  <path d="M584,118 C630,165 720,160 745,205" fill="none" stroke="#57606a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="705" y="150" font-size="15" font-family="Consolas, Menlo, monospace" fill="#57606a">--py_out</text>

  <text x="24" y="196" font-size="15" font-weight="600" fill="#57606a">RUN TIME</text>

  <rect x="30" y="210" width="250" height="130" rx="12" fill="#ffffff" stroke="#0969da" stroke-width="2"/>
  <text x="48" y="243" font-size="19" font-weight="600" fill="#1f2328">C++ project</text>
  <text x="48" y="274" font-size="14" font-family="Consolas, Menlo, monospace" fill="#0550ae">#include "*.g.h"</text>
  <text x="48" y="299" font-size="14" font-family="Consolas, Menlo, monospace" fill="#0550ae">route.Serialize()</text>
  <text x="48" y="325" font-size="14" fill="#57606a">Protaco.hpp, header-only</text>

  <rect x="325" y="210" width="250" height="130" rx="12" fill="#ffffff" stroke="#8250df" stroke-width="2"/>
  <text x="343" y="243" font-size="19" font-weight="600" fill="#1f2328">C# project</text>
  <text x="343" y="274" font-size="14" font-family="Consolas, Menlo, monospace" fill="#0550ae">compile *.g.cs</text>
  <text x="343" y="299" font-size="14" font-family="Consolas, Menlo, monospace" fill="#0550ae">Codec.ToObject&lt;T&gt;(bytes)</text>
  <text x="343" y="325" font-size="14" fill="#57606a">Protaco.cs, one source file</text>

  <rect x="620" y="210" width="250" height="130" rx="12" fill="#ffffff" stroke="#1a7f37" stroke-width="2"/>
  <text x="638" y="243" font-size="19" font-weight="600" fill="#1f2328">Python project</text>
  <text x="638" y="274" font-size="14" font-family="Consolas, Menlo, monospace" fill="#0550ae">import *_g.py</text>
  <text x="638" y="299" font-size="14" font-family="Consolas, Menlo, monospace" fill="#0550ae">protaco.ToObject(T, data)</text>
  <text x="638" y="325" font-size="14" fill="#57606a">protaco.py, standard library</text>

  <line x1="155" y1="345" x2="155" y2="385" stroke="#57606a" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="450" y1="345" x2="450" y2="385" stroke="#57606a" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="745" y1="345" x2="745" y2="385" stroke="#57606a" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <rect x="30" y="389" width="840" height="50" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="450" y="420" text-anchor="middle" font-size="16" fill="#1f2328"><tspan font-weight="600">same serialization format</tspan><tspan fill="#57606a">  over any transport: TCP, pipe, file, shared memory</tspan></text>
</svg>
