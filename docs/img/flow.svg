<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="898" height="368" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>

  <text x="24" y="38" font-size="15" font-weight="600" fill="#57606a">BUILD TIME</text>
  <rect x="150" y="50" width="250" height="66" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="275" y="90" text-anchor="middle" font-size="19" font-family="Consolas, Menlo, monospace" fill="#0550ae">schemas/*.yaml</text>
  <line x1="402" y1="83" x2="473" y2="83" stroke="#57606a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="477" y="50" width="160" height="66" rx="12" fill="#1f2328"/>
  <text x="557" y="90" text-anchor="middle" font-size="21" font-weight="600" fill="#ffffff">protacoc</text>

  <path d="M520,118 C470,170 260,160 200,205" fill="none" stroke="#57606a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="300" y="162" font-size="15" font-family="Consolas, Menlo, monospace" fill="#57606a">--cpp_out</text>
  <path d="M594,118 C640,170 650,160 700,205" fill="none" stroke="#57606a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="650" y="162" font-size="15" font-family="Consolas, Menlo, monospace" fill="#57606a">--cs_out</text>

  <text x="24" y="196" font-size="15" font-weight="600" fill="#57606a">RUN TIME</text>
  <rect x="40" y="210" width="290" height="130" rx="12" fill="#ffffff" stroke="#0969da" stroke-width="2"/>
  <text x="60" y="244" font-size="19" font-weight="600" fill="#1f2328">C++ project</text>
  <text x="60" y="276" font-size="15" font-family="Consolas, Menlo, monospace" fill="#0550ae">#include "*.g.h"</text>
  <text x="60" y="302" font-size="15" font-family="Consolas, Menlo, monospace" fill="#0550ae">route.Serialize()</text>
  <text x="60" y="326" font-size="14" fill="#57606a">Protaco.hpp, header-only</text>

  <rect x="570" y="210" width="290" height="130" rx="12" fill="#ffffff" stroke="#8250df" stroke-width="2"/>
  <text x="590" y="244" font-size="19" font-weight="600" fill="#1f2328">C# project</text>
  <text x="590" y="276" font-size="15" font-family="Consolas, Menlo, monospace" fill="#0550ae">compile *.g.cs</text>
  <text x="590" y="302" font-size="15" font-family="Consolas, Menlo, monospace" fill="#0550ae">ToObject&lt;T&gt;(bytes)</text>
  <text x="590" y="326" font-size="14" fill="#57606a">Protaco.cs, one source file</text>

  <line x1="336" y1="275" x2="564" y2="275" stroke="#57606a" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="450" y="262" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2328">same frame bytes</text>
  <text x="450" y="300" text-anchor="middle" font-size="14" fill="#57606a">any transport:</text>
  <text x="450" y="320" text-anchor="middle" font-size="14" fill="#57606a">TCP, pipe, file, shared memory</text>
</svg>
