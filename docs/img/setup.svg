<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="1" y="1" width="898" height="398" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>

  <text x="230" y="44" text-anchor="middle" font-size="21" font-weight="600" fill="#1f2328">Protocol Buffers (C++)</text>
  <g font-size="17" fill="#1f2328">
    <rect x="30" y="66" width="400" height="62" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="50" y="104"><tspan font-weight="600">1</tspan>  Install protoc</text>
    <rect x="30" y="140" width="400" height="74" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="50" y="171"><tspan font-weight="600">2</tspan>  Build libprotobuf with CMake</text>
    <text x="72" y="198" font-size="15" fill="#57606a">84 .cc files; version 22 and later add Abseil</text>
    <rect x="30" y="226" width="400" height="74" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="50" y="257"><tspan font-weight="600">3</tspan>  Add include paths, link the library</text>
    <text x="72" y="284" font-size="15" fill="#57606a">static Release lib: about 20 MB</text>
    <rect x="30" y="312" width="400" height="62" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="50" y="350"><tspan font-weight="600">4</tspan>  Keep protoc and library versions in step</text>
  </g>

  <line x1="450" y1="30" x2="450" y2="374" stroke="#d0d7de" stroke-width="1.5"/>

  <text x="670" y="44" text-anchor="middle" font-size="21" font-weight="600" fill="#1f2328">Protaco</text>
  <g font-size="17" fill="#1f2328">
    <rect x="470" y="66" width="400" height="74" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="2"/>
    <text x="490" y="97"><tspan font-weight="600">1</tspan>  Run protacoc.exe</text>
    <text x="512" y="124" font-size="15" fill="#57606a">one file, about 150 KB</text>
    <rect x="470" y="152" width="400" height="74" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="2"/>
    <text x="490" y="183"><tspan font-weight="600">2</tspan>  <tspan font-family="Consolas, Menlo, monospace" font-size="16" fill="#0550ae">#include "DeliveryRoute.g.h"</tspan></text>
    <text x="512" y="210" font-size="15" fill="#57606a">Protaco.hpp is written right next to it</text>
  </g>
  <rect x="470" y="250" width="400" height="88" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="2"/>
  <text x="670" y="287" text-anchor="middle" font-size="21" font-weight="600" fill="#1a7f37">Done ✓</text>
  <text x="670" y="317" text-anchor="middle" font-size="15" fill="#1a7f37">nothing to install, build or link</text>
</svg>
