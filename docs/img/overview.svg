<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="898" height="328" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>

  <rect x="30" y="85" width="230" height="160" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="145" y="122" text-anchor="middle" font-size="21" font-weight="600" fill="#1f2328">YAML schema</text>
  <text x="54" y="160" font-size="17" font-family="Consolas, Menlo, monospace" fill="#0550ae">DeliveryRoute.yaml</text>
  <text x="54" y="188" font-size="17" font-family="Consolas, Menlo, monospace" fill="#0550ae">RouteStop.yaml</text>
  <text x="145" y="226" text-anchor="middle" font-size="15" fill="#57606a">one message per file</text>

  <line x1="262" y1="165" x2="318" y2="165" stroke="#57606a" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="322" y="130" width="150" height="70" rx="12" fill="#1f2328"/>
  <text x="397" y="172" text-anchor="middle" font-size="21" font-weight="600" fill="#ffffff">protacoc</text>

  <path d="M474,158 C515,158 515,75 556,75" fill="none" stroke="#57606a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="474" y1="165" x2="556" y2="165" stroke="#57606a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M474,172 C515,172 515,255 556,255" fill="none" stroke="#8c959f" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>

  <rect x="560" y="38" width="315" height="76" rx="12" fill="#ffffff" stroke="#0969da" stroke-width="2"/>
  <text x="580" y="68" font-size="19" font-weight="600" fill="#1f2328">C++</text>
  <text x="634" y="68" font-size="15" font-family="Consolas, Menlo, monospace" fill="#0550ae">*.g.h + Protaco.hpp</text>
  <text x="580" y="96" font-size="15" fill="#57606a">header-only, nothing to link</text>

  <rect x="560" y="127" width="315" height="76" rx="12" fill="#ffffff" stroke="#8250df" stroke-width="2"/>
  <text x="580" y="157" font-size="19" font-weight="600" fill="#1f2328">C#</text>
  <text x="634" y="157" font-size="15" font-family="Consolas, Menlo, monospace" fill="#0550ae">*.g.cs + Protaco.cs</text>
  <text x="580" y="185" font-size="15" fill="#57606a">one runtime source file</text>

  <rect x="560" y="216" width="315" height="76" rx="12" fill="#ffffff" stroke="#8c959f" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="580" y="246" font-size="19" font-weight="600" fill="#6e7781">Python</text>
  <text x="580" y="274" font-size="15" fill="#6e7781">planned</text>

  <text x="450" y="312" text-anchor="middle" font-size="15" fill="#57606a">C++ and C# objects serialize to the same bytes</text>
</svg>
